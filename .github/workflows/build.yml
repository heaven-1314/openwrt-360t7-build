name: Build 360T7 Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'files/**'

env:
  IMM_REPO: https://github.com/immortalwrt/immortalwrt.git
  IMM_BRANCH: master
  TARGET: mediatek
  SUBTARGET: filogic

concurrency:
  group: build-360t7
  cancel-in-progress: true

jobs:
  build:
    name: Build ImmortalWrt 360T7
    runs-on: ubuntu-24.04
    timeout-minutes: 600

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache /usr/local/.ghcup \
            /usr/lib/jvm /usr/lib/firefox /usr/share/swift
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl sudo \
            dwarves ccache jq
          pahole --version || { echo "ERROR: pahole not found"; exit 1; }

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: |
          echo "date=$(date +%Y-%m)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-360t7-${{ steps.cache-key.outputs.date }}-${{ steps.cache-key.outputs.sha }}
          restore-keys: ccache-360t7-${{ steps.cache-key.outputs.date }}-

      - name: Clone ImmortalWrt source
        run: |
          if [ -d openwrt ] && [ ! -d openwrt/.git ]; then
            rm -rf openwrt
          fi
          if [ -d openwrt/.git ]; then
            cd openwrt && git pull --ff-only origin "$IMM_BRANCH"
          else
            git clone --depth=1 --branch "$IMM_BRANCH" "$IMM_REPO" openwrt
          fi
          cd openwrt
          echo "## ImmortalWrt commit" >> $GITHUB_STEP_SUMMARY
          echo "$(git log -1 --format='%H %ci %s')" >> $GITHUB_STEP_SUMMARY

      - name: Update and install feeds
        run: |
          cd openwrt
          cp feeds.conf.default feeds.conf
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy pre-configured files into build tree
        run: |
          cp -rv ${{ github.workspace }}/files openwrt/
          echo "=== Custom files ==="
          find openwrt/files -type f | sort

      - name: Patch kernel for BTF + full BPF support
        run: |
          cd openwrt
          bash ${{ github.workspace }}/scripts/patch-kernel.sh

      - name: Configure
        run: |
          cd openwrt
          cat > .config << 'SEED'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y
          SEED
          cat ${{ github.workspace }}/config/360t7.seed >> .config
          make defconfig

      - name: Verify config — FAIL if packages missing
        run: |
          cd openwrt
          FAIL=0
          echo "=== Target ==="
          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y" .config || { echo "❌ Target missing!"; FAIL=1; }
          echo "=== Chinese i18n ==="
          grep -q "CONFIG_LUCI_LANG_zh_Hans=y" .config || { echo "❌ Chinese language missing!"; FAIL=1; }
          echo "=== argon ==="
          grep -q "CONFIG_PACKAGE_luci-theme-argon=y" .config || { echo "❌ argon theme missing!"; FAIL=1; }
          echo "=== statistics ==="
          grep -q "CONFIG_PACKAGE_luci-app-statistics=y" .config || { echo "❌ statistics missing!"; FAIL=1; }
          echo "=== adblock-fast ==="
          grep -q "CONFIG_PACKAGE_luci-app-adblock-fast=y" .config || { echo "❌ adblock-fast missing!"; FAIL=1; }
          echo "=== BTF kernel ==="
          grep -rq "CONFIG_DEBUG_INFO=y" target/linux/*/config-* 2>/dev/null || echo "⚠️ CONFIG_DEBUG_INFO not in kernel config"
          grep -rq "CONFIG_DEBUG_INFO_BTF=y" target/linux/*/config-* 2>/dev/null || echo "⚠️ CONFIG_DEBUG_INFO_BTF not in kernel config"
          echo "=== Pre-config files ==="
          [ -f files/etc/config/wireless ] && echo "✓ wireless" || echo "❌ wireless missing"
          [ -f files/etc/config/daed ] && echo "✓ daed" || echo "❌ daed config missing"
          [ -f files/etc/daed/wing.db ] && echo "✓ wing.db" || echo "❌ wing.db missing"
          echo "=== Summary ==="
          [ $FAIL -eq 0 ] && echo "✅ All packages verified" || { echo "❌ Some packages missing — aborting build"; exit 1; }

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) 2>&1 | tail -20 || true

      - name: Build firmware
        run: |
          cd openwrt
          set -o pipefail
          export CCACHE_DIR=~/.ccache
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Show build log on failure
        if: failure()
        run: |
          cd openwrt
          tail -300 build.log 2>/dev/null || true

      - name: Collect firmware artifacts
        if: success()
        run: |
          cd openwrt/bin/targets/$TARGET/$SUBTARGET
          echo "=== All output files ==="
          ls -lh
          mkdir -p ${{ github.workspace }}/artifacts
          cp -v *.itb *.bin *.fip *.manifest *sha256sums* ${{ github.workspace }}/artifacts/ 2>/dev/null || true
          ls -lh ${{ github.workspace }}/artifacts/

      - name: Verify sysupgrade exists
        if: success()
        run: |
          if ls artifacts/*360t7*sysupgrade* 1>/dev/null 2>&1; then
            echo "✅ sysupgrade firmware found"
            ls -lh artifacts/*360t7*sysupgrade*
          else
            echo "❌ NO sysupgrade firmware!"
            exit 1
          fi

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-360t7-final
          path: artifacts/*
          retention-days: 30
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          if ls openwrt/bin/targets/$TARGET/$SUBTARGET/*360t7*sysupgrade* 1>/dev/null 2>&1; then
            echo "✅ **SUCCESS** — firmware built!" >> $GITHUB_STEP_SUMMARY
            ls -lh openwrt/bin/targets/$TARGET/$SUBTARGET/*360t7*sysupgrade* >> $GITHUB_STEP_SUMMARY 2>&1
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 刷机:" >> $GITHUB_STEP_SUMMARY
            echo "sysupgrade -n /tmp/sysupgrade.itb (首次不保留配置)" >> $GITHUB_STEP_SUMMARY
            echo "所有配置已预装（WiFi/IPv6/daed/中文/防火墙）" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED** — no sysupgrade firmware" >> $GITHUB_STEP_SUMMARY
          fi
